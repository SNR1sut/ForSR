  <style>
    * {
      box-sizing: border-box;
    }
body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
overflow: hidden; /* Prevents awkward horizontal shifting */
    font-family: 'Sorts Mill Goudy', Georgia, serif;
  background-color: #ffffff; /* Changed from #f4eae1 to white */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .envelope-container {
      position: relative;
      width: 360px;
      height: 240px;
      cursor: pointer;
      z-index: 10;
      transform-style: preserve-3d;
      animation: beautifulFloat 6s ease-in-out infinite;
      transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
    }

    .envelope-container:hover:not(.is-open) {
      transform: scale(1.04);
    }

    /* 1970s Terracotta Envelope */
/* 1970s Terracotta Envelope */
.envelope {
  position: absolute;
  width: 100%;
  height: 100%;
  background-color: #c86d51;
  background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
  background-blend-mode: soft-light; /* Makes the pattern soft and faint */
  border-radius: 4px;
  box-shadow: 0 25px 50px rgba(74, 38, 25, 0.25);
  transform-style: preserve-3d;
  clip-path: inset(-600px 0px 0px 0px); /* Prevents bottom leakage during zoom */
}
/* Creates a 3D-safe bottom mask to keep the letter inside */


    /* Top Flap */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 180px solid transparent;
      border-right: 180px solid transparent;
      border-top: 130px solid #b55d42;
      transform-origin: top;
      transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s 0.5s;
      z-index: 5;
    }

    /* Antique Wax Seal */
    .wax-seal {
      position: absolute;
      top: 115px;
      left: 180px;
      width: 46px;
      height: 46px;
      background: radial-gradient(circle, #7a1c1c 0%, #521010 100%);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      box-shadow: 0 4px 12px rgba(40, 10, 10, 0.4), inset 0 2px 4px rgba(255,255,255,0.2);
      transition: all 0.6s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .wax-seal::before {
      content: '';
      position: absolute;
      width: 54px;
      height: 54px;
      border-radius: 46%;
      background: rgba(82, 16, 16, 0.85);
      z-index: -1;
      transform: rotate(15deg);
    }
    .wax-seal::after {
      content: '✿';
      color: rgba(254, 244, 244, 0.7);
      font-size: 1.3rem;
    }

    /* Front Pocket */
    /* Front Pocket Flaps */
.envelope-sides {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 4;
  border-radius: 4px;
  /* Adds matching paper texture & subtle depth to the front pocket flaps */
  filter: contrast(102%) drop-shadow(0 -1px 2px rgba(0,0,0,0.12));
}

.envelope-sides::before {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0;
  height: 0;
  border-left: 180px solid #d1775a;
  border-top: 120px solid transparent;
  border-bottom: 120px solid #d1775a;
}

.envelope-sides::after {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 0;
  height: 0;
  border-right: 180px solid #d1775a;
  border-top: 120px solid transparent;
  border-bottom: 120px solid #d1775a;
}

    /* Classic Aged Letter Card */
.letter-card {
  position: absolute;
  top: 35px;
  left: 18px;
  width: 324px;
  height: 180px;
  
  /* Pure Clean White Base */
  background-color: #ffffff;
  
  /* Ultra-soft paper texture (No dark gradients) */
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='whitePaper'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23whitePaper)' opacity='0.02'/%3E%3C/svg%3E");

  border-radius: 2px;
  border: 1px solid #eaeaea; /* Very light subtle border */
  
  /* ONLY Outer Drop Shadow (All inner shadows removed) */
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);

  z-index: 3;
  text-align: center;
  transition: transform 2.8s cubic-bezier(0.16, 1, 0.3, 1), 
              height 2.8s cubic-bezier(0.16, 1, 0.3, 1), 
              z-index 0.1s;
  overflow: hidden;
  will-change: transform, height;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
}

.letter-body p {
  font-family: 'Alex Brush', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 400;
  line-height: 1.6;
  color: #2b2b2b; /* Crisp Charcoal Ink */
  margin: 0 0 16px 0;
}

    /* Teaser Content (Cover) */
    .teaser-content {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 180px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 24px;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .teaser-content h2 {
      font-family: 'Italianno', cursive;
      font-size: 2.6rem;
      color: #8c2d19;
      margin: 0 0 4px 0;
      font-weight: normal;
    }

    .teaser-content p {
      margin: 0;
      font-family: 'Sorts Mill Goudy', serif;
      font-size: 0.78rem;
      color: #7a6855;
      letter-spacing: 0.15em;
      font-style: italic;
    }


     /* Opened Letter Body */
     .letter-body {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 410px;
        padding: 24px 20px; /* Adjust top padding for a clean margin */
        opacity: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* Shifts content to the top */
        align-items: center;
        transition: opacity 1.2s ease 1.5s;
    }

    /* Flower image placement under letter paragraph */
.letter-flower-img {
  display: block;
  width: 50px;           /* Adjust width to fit your design */
  height: auto;           /* Maintains realistic proportions */
  margin: 0px auto;  /* Centers image & adds spacing above/below */
  margin-top: -10px;
  object-fit: contain;
  pointer-events: none;   /* Prevents accidental clicks/drag selection */
}

    .envelope-container.is-open {
      animation: none;
      transform: translate3d(0, 110px, 0);
      cursor: default;
    }
    .envelope-container.is-open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 2; 
    }
    .envelope-container.is-open .wax-seal {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.4);
      pointer-events: none;
    }
    .envelope-container.is-open .letter-card {
      transform: translate3d(0, -220px, 0);
      height: 410px;
      z-index: 3; 
      box-shadow: inset 0 0 30px rgba(180, 140, 90, 0.12), 0 10px 30px rgba(74, 38, 25, 0.18);
      transition-delay: 0.9s;
    }
    .envelope-container.is-open .teaser-content {
      opacity: 0;
      pointer-events: none;
    }
    .envelope-container.is-open .letter-body {
      opacity: 1;
      pointer-events: auto;
    }

    .cue-text {
      position: absolute;
      bottom: 40px;
      font-family: 'Sorts Mill Goudy', serif;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #8c7b6c;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 10;
      font-style: italic;
    }
    .cue-text.fade {
      opacity: 0;
    }

    @keyframes beautifulFloat {
      0%, 100% { transform: translate3d(0, 0px, 0) rotate(0deg); }
      50% { transform: translate3d(0, -12px, 0) rotate(-1deg); }
    }


   #floating-scene {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 2;
}

/* Base Reveal & Floating Mechanics */
.reveal-wrapper {
  position: absolute;
  opacity: 0;
  transform: translateY(25px);
  transition: opacity 1.8s cubic-bezier(0.16, 1, 0.3, 1), transform 2.2s cubic-bezier(0.16, 1, 0.3, 1);
}

#floating-scene.is-active .reveal-wrapper {
  opacity: 1;
  transform: translateY(0px);
}

.bobbing-element {
  width: 100%;
  height: auto;
  display: block;
  animation: gentleBob 6s ease-in-out infinite;
  will-change: transform;
}

@keyframes gentleBob {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

/* --- SMALLER & ASYMMETRIC 6 HOUSE POSITIONS --- */
/* House 1: Top Left */
.h-slot-1 { top: 4vh;    left: 6vw;    width: clamp(65px, 7vw, 95px); transition-delay: 0.1s; }

/* House 2: Top Center-Right */
.h-slot-2 { top: 3vh;    right: 20vw;  width: clamp(60px, 6.5vw, 85px); transition-delay: 0.4s; }

/* House 3: Mid-High Left */

/* House 4: Mid-Low Right */

/* House 5: Bottom Left-Center */

.h-slot-7 { top: 18vh;   right: 6vw;   width: clamp(60px, 6.5vw, 85px); transition-delay: 0.35s; }

/* 5 Cloud Slots (Positioned to Frame Houses) */
.c-slot-1 { top: 14vh; left: 17vw; width: clamp(80px, 9vw, 120px); transition-delay: 0.25s; }
.c-slot-2 { top: 12vh; right: 17vw; width: clamp(80px, 9vw, 120px); transition-delay: 0.55s; }
.c-slot-3 { bottom: 20vh; left: 16vw; width: clamp(85px, 9.5vw, 125px); transition-delay: 0.35s; }
.c-slot-4 { bottom: 18vh; right: 16vw; width: clamp(85px, 9.5vw, 125px); transition-delay: 0.65s; }
.c-slot-5 { top: 2vh; left: 45vw; width: clamp(75px, 8vw, 110px); transition-delay: 0.15s; }
.c-slot-6 { top: 75vh; left: 42vw; width: clamp(75px, 8vw, 110px); transition-delay: 0.45s; }

/* Asynchronous Floating Animations */
.h-slot-1 .bobbing-element { animation-duration: 7.2s; animation-delay: 0.0s; }
.h-slot-2 .bobbing-element { animation-duration: 8.5s; animation-delay: 1.1s; }
.h-slot-3 .bobbing-element { animation-duration: 6.8s; animation-delay: 0.5s; }
.h-slot-4 .bobbing-element { animation-duration: 7.9s; animation-delay: 1.7s; }
.h-slot-5 .bobbing-element { animation-duration: 8.1s; animation-delay: 0.3s; }
.h-slot-6 .bobbing-element { animation-duration: 7.4s; animation-delay: 1.3s; }
.h-slot-7 .bobbing-element { animation-duration: 7.0s; animation-delay: 0.9s; }
.h-slot-8 .bobbing-element { animation-duration: 8.3s; animation-delay: 1.4s; }

.c-slot-1 .bobbing-element { animation-duration: 5.8s; animation-delay: 0.4s; }
.c-slot-2 .bobbing-element { animation-duration: 6.3s; animation-delay: 1.2s; }
.c-slot-3 .bobbing-element { animation-duration: 5.5s; animation-delay: 0.8s; }
.c-slot-4 .bobbing-element { animation-duration: 6.7s; animation-delay: 1.5s; }
.c-slot-5 .bobbing-element { animation-duration: 6.0s; animation-delay: 0.2s; }
.c-slot-6 .bobbing-element { animation-duration: 6.0s; animation-delay: 0.2s; }

          <div class="letter-body">

  <script>


const musicButton = document.getElementById('musicButton');
const bgMusic = document.getElementById('bgMusic');

/* Prevent multiple copies of the song from playing
   when the page is opened again in another tab/window. */
const musicChannel = new BroadcastChannel('love-letter-music');

musicChannel.addEventListener('message', (event) => {
    if (event.data === 'STOP_MUSIC') {
        bgMusic.pause();
        bgMusic.currentTime = 0;
        musicButton.textContent = '♪ Play Song';
    }
});

musicButton.addEventListener('click', () => {

    if (bgMusic.paused) {

        /* Tell any other open copy of this webpage to stop */
        musicChannel.postMessage('STOP_MUSIC');

        bgMusic.currentTime = 0;

        bgMusic.play()
            .then(() => {
                musicButton.textContent = '♫ Playing';
            })
            .catch((error) => {
                console.error('Music could not play:', error);
                musicButton.textContent = '⚠ Music Error';
            });

    } else {

        bgMusic.pause();
        musicButton.textContent = '♪ Play Song';

    }

});
    const envelope = document.getElementById('envelope');
    const cue = document.getElementById('cue');
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let burstParticles = [];
    let ambientParticles = [];
    let animationId = null;
    let isOpened = false;
    
    let burstSpawningFinished = false;
    let ambientStarted = false;

    // Array Shuffler for Refresh Randomization
function initRandomScene() {
const houseImages = [
      './images/house1.webp', './images/house2.webp', './images/house3.webp', 
      './images/house4.webp', './images/house5.webp', './images/house6.webp', './images/house7.webp', './images/house8.webp'
    ];
    const cloudImages = [
      './images/cloud1.webp', './images/cloud2.webp', './images/cloud3.webp', 
      './images/cloud4.webp', './images/cloud5.webp', './images/cloud6.webp'
    ];

  const shuffle = (arr) => {
    const array = [...arr];
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  };

  const shuffledHouses = shuffle(houseImages);
  const shuffledClouds = shuffle(cloudImages);

  shuffledHouses.forEach((src, idx) => {
    const el = document.getElementById(`house-img-${idx + 1}`);
    if (el) el.src = src;
  });

  shuffledClouds.forEach((src, idx) => {
    const el = document.getElementById(`cloud-img-${idx + 1}`);
    if (el) el.src = src;
  });
}

// Execute Random Assignment on Page Load
initRandomScene();

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Set to 90 images with .webp extension
    const customFlowerImages = Array.from({ length: 90 }, (_, i) => `./images/mine${i + 1}.webp`);
    const validImages = [];

    customFlowerImages.forEach(src => {
      const img = new Image();
      img.src = src;
      img.onload = () => validImages.push(img);
      img.onerror = () => {};
    });

    /* --- Initial Opening Burst Particle --- */
    class PremiumFlowerParticle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.PI * 1.05 + Math.random() * Math.PI * 0.9;
        const speed = 6 + Math.random() * 16; 
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 5;
        this.gravity = 0.022; 
        this.drag = 0.985;
        this.angle = Math.random() * Math.PI * 2;
        this.spinSpeed = (Math.random() - 0.5) * 0.025;
        this.size = 75 + Math.random() * 90; 
        this.image = validImages[Math.floor(Math.random() * validImages.length)];
        this.opacity = 1.0;
        this.decay = 0.00015 + Math.random() * 0.00025; 
        this.swaySpeed = 0.006 + Math.random() * 0.012;
        this.swayOffset = Math.random() * 200;
      }
      update() {
        this.vx *= this.drag;
        this.vy *= this.drag;
        this.vy += this.gravity;
        this.x += this.vx + Math.sin(this.swayOffset) * 0.85;
        this.y += this.vy;
        this.swayOffset += this.swaySpeed;
        this.angle += this.spinSpeed;
        this.opacity -= this.decay;
      }
      draw() {
        if (!this.image) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.opacity);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.drawImage(this.image, -this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

    /* --- Dynamic Fluid Curtain Math --- */
    function getBezier(t, p0, p1, p2, p3) {
      const inv = 1 - t;
      const x = inv**3 * p0.x + 3 * inv**2 * t * p1.x + 3 * inv * t**2 * p2.x + t**3 * p3.x;
      const y = inv**3 * p0.y + 3 * inv**2 * t * p1.y + 3 * inv * t**2 * p2.y + t**3 * p3.y;
      return {x, y};
    }

    function getBezierNormal(t, p0, p1, p2, p3) {
      const inv = 1 - t;
      const dx = 3 * inv**2 * (p1.x - p0.x) + 6 * inv * t * (p2.x - p1.x) + 3 * t**2 * (p3.x - p2.x);
      const dy = 3 * inv**2 * (p1.y - p0.y) + 6 * inv * t * (p2.y - p1.y) + 3 * t**2 * (p3.y - p2.y);
      const length = Math.sqrt(dx*dx + dy*dy);
      return { nx: -dy / length, ny: dx / length };
    }

    /* --- Elegant Fluid Curtain Flower --- */
    class FluidCurtainFlower {
      constructor(index, totalAmount) {
        // Multiplier 1.0 ensures seamless continuous flow with no empty screen delay
        this.progress = -(index * (1.0 / totalAmount));
        this.speed = 0.0013; 
        
        this.lateralOffset = (Math.random() - 0.5) * 130; 
        this.flutterPhase = Math.random() * Math.PI * 2;
        this.flutterSpeed = 0.015 + Math.random() * 0.02;

        this.size = 45 + Math.random() * 35;
        this.angle = Math.random() * Math.PI * 2;
        this.spinSpeed = (Math.random() - 0.5) * 0.009;
        this.image = validImages[Math.floor(Math.random() * validImages.length)];
        this.maxOpacity = 0.45 + Math.random() * 0.4;
        this.opacity = 0;
      }

      update(globalTime, p0, p1, p2, p3) {
        this.progress += this.speed;
        this.angle += this.spinSpeed;
        this.flutterPhase += this.flutterSpeed;

        if (this.progress >= 1) {
          this.progress -= 1; // Seamless loop
          // Re-randomize image every time a flower loops back
          this.image = validImages[Math.floor(Math.random() * validImages.length)];
        }

        const t = this.progress;

        if (t < 0) {
          this.opacity = 0; 
        } else if (t < 0.15) {
          this.opacity = (t / 0.15) * this.maxOpacity;
        } else if (t > 0.85) {
          this.opacity = ((1 - t) / 0.15) * this.maxOpacity;
        } else {
          this.opacity = this.maxOpacity;
        }

        if (t >= 0 && t <= 1) {
          const basePos = getBezier(t, p0, p1, p2, p3);
          const normal = getBezierNormal(t, p0, p1, p2, p3);
          const currentOffset = this.lateralOffset + Math.sin(this.flutterPhase) * 25;

          this.x = basePos.x + normal.nx * currentOffset;
          this.y = basePos.y + normal.ny * currentOffset;
        }
      }

      draw() {
        if (!this.image || this.opacity <= 0 || this.progress < 0) return;
        ctx.save();
        ctx.globalAlpha = Math.min(1, Math.max(0, this.opacity));
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.drawImage(this.image, -this.size / 2, -this.size / 2, this.size, this.size);
        ctx.restore();
      }
    }

   function cascadeBouquet() {
      const totalBurstFlowers = 750;
      let spawned = 0;

      for (let i = 0; i < totalBurstFlowers; i++) {
        setTimeout(() => {
          if (isOpened && validImages.length > 0) {
            const rect = envelope.getBoundingClientRect();
            const currentOriginX = rect.left + rect.width / 2;
            const currentOriginY = rect.top + rect.height / 3;
            
            burstParticles.push(new PremiumFlowerParticle(currentOriginX, currentOriginY));
          }
          spawned++;
          if (spawned === totalBurstFlowers) {
            burstSpawningFinished = true;
          }
        }, Math.random() * 6500); 
      }
    }

    function startAmbientStream() {
      const FIXED_FLOWER_AMOUNT = 120; // 120 flowers flowing along the curtain path
      if (validImages.length > 0) {
        for (let i = 0; i < FIXED_FLOWER_AMOUNT; i++) {
          ambientParticles.push(new FluidCurtainFlower(i, FIXED_FLOWER_AMOUNT));
        }
      }
    }

    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const time = Date.now() * 0.0008;

      const p0 = { 
        x: -200, 
        y: cy + 300 + Math.sin(time * 0.7) * 120 
      };
      const p1 = { 
        x: cx - 250 + Math.cos(time * 0.6) * 180, 
        y: cy + 180 + Math.sin(time * 0.9) * 150 
      };
      const p2 = { 
        x: cx + 250 + Math.sin(time * 0.8) * 180, 
        y: cy - 180 + Math.cos(time * 0.7) * 150 
      };
      const p3 = { 
        x: canvas.width + 200, 
        y: cy - 300 + Math.cos(time * 0.5) * 120 
      };

      // Burst Updates
      burstParticles.sort((a, b) => a.size - b.size);
      burstParticles = burstParticles.filter(p => p.opacity > 0 && p.y < canvas.height + 150);
      burstParticles.forEach(p => {
        p.update();
        p.draw();
      });

if (burstSpawningFinished && burstParticles.length === 0 && !ambientStarted) {
  ambientStarted = true;
  startAmbientStream();
  document.getElementById('floating-scene').classList.add('is-active');
}

      // Fluid Curtain Updates
      ambientParticles.forEach(p => {
        p.update(time, p0, p1, p2, p3);
        p.draw();
      });

      animationId = requestAnimationFrame(loop);
    }


    function triggerOpeningSequence() {
      if (isOpened) return;
      isOpened = true;
      envelope.classList.add('is-open');
      cue.classList.add('fade');
      if (!animationId) {
        loop();
      }
      setTimeout(cascadeBouquet, 900);
    }

    envelope.addEventListener('click', triggerOpeningSequence);
    envelope.addEventListener('touchstart', (e) => {
      if (!isOpened) {
        e.preventDefault();
        triggerOpeningSequence();
      }
    }, { passive: false });
  </script>
